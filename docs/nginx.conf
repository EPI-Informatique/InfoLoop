# InfoLoop nginx site configuration (Debian/Ubuntu style).
# Place in /etc/nginx/sites-available/infoloop and symlink to sites-enabled.
#
# Point `root` at the public/ directory of your InfoLoop checkout.

server {
    listen 80;
    listen [::]:80;
    server_name signage.example.com;

    # Redirect to HTTPS in production (recommended)
    # return 301 https://$host$request_uri;

    root /var/www/infoloop/public;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; script-src 'self' 'unsafe-inline' https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Uploaded media served statically with long cache (immutable, content-hashed names)
    location /files/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Everything else goes to the single front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Block dotfiles
    location ~ /\. { deny all; }

    client_max_body_size 200M;   # keep in sync with MAX_UPLOAD_MB
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

